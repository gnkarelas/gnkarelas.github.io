<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Working on Something Great</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            padding: 40px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }
        h1 {
            font-size: 2rem;
            color: #f0f6fc;
            margin-bottom: 12px;
        }
        p {
            font-size: 1rem;
            line-height: 1.5;
            color: #8b949e;
            margin-bottom: 24px;
        }
        .badge {
            display: inline-block;
            background: #1f6feb;
            color: #ffffff;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">Coming Soon</span>
        <h1>Under Construction</h1>
        <p>I am currently crafting something awesome here. Check back soon for the official launch!</p>

</html>
